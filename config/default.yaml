# =====================================================
# INPUT
# =====================================================

input:

  fastq: input/SRR25593956.fastq.gz

  reference: reference/lsdv_reference.fasta

  # Optional ARTIC BED primer scheme
  bed: primer.bed


# =====================================================
# OUTPUT
# =====================================================

output:

  directory: output


# =====================================================
# SYSTEM
# =====================================================

threads: 8


# =====================================================
# DOCKER IMAGES
# =====================================================

docker:

  mount: /pipeline

  workdir: /pipeline

  core: suhas0/lsdv_core:v4

  medaka: ontresearch/medaka:latest

  clair3: hkubal/clair3:latest

  longshot: staphb/longshot:latest

  align_trim: align_trim:v1

  snpeff: suhas0/snpeff_lsdv:v1


# =====================================================
# QUALITY CONTROL
# =====================================================

qc:

  # nanoplot
  # fastp
  tool: nanoplot


# =====================================================
# FILTERING MODE
# =====================================================

filter:

  # recommended
  # manual
  mode: recommended


# =====================================================
# FASTP
# =====================================================

fastp:

  qualified_quality_phred: 15

  length_required: 500

  detect_adapter_for_pe: false


# =====================================================
# NANOFILT
# =====================================================

nanofilt:

  enabled: true

  # Used only when filter.mode = manual
  min_quality: 10

  min_length: 500

  headcrop: 0

  tailcrop: 0


# =====================================================
# ALIGNMENT
# =====================================================

alignment:

  tool: minimap2


# =====================================================
# PRIMER TRIMMING
# =====================================================

primer:

  enabled: true


# =====================================================
# VARIANT CALLER
# =====================================================

variant:

  # bcftools
  # longshot
  # medaka
  # clair3
  tool: medaka


# =====================================================
# MEDAKA
# =====================================================

medaka:

  # One inference model is shared by Medaka variant calling and consensus.
  # With primer.enabled: true and a BED file, both use trimmed.sorted.bam.
  model: r1041_e82_400bps_sup_v5.2.0

  # ARTIC align_trim can assign multiple read groups; process them together.
  ignore_read_groups: true


# =====================================================
# CLAIR3
# =====================================================

clair3:

  model_path: /opt/models/ont

  platform: ont


# =====================================================
# CONSENSUS
# =====================================================

consensus:

  # bcftools
  # medaka
  tool: medaka


# =====================================================
# ANNOTATION
# =====================================================

annotation:

  tool: snpeff


# =====================================================
# REPORT
# =====================================================

report:

  format: text
